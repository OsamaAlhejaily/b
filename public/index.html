  <div id="game" style="display:none">
    <div class="letter" id="letter">?</div><br>

  <script>
    const socket = io();

    function joinRoom() {
      currentRoom = document.getElementById('roomId').value;
      if (!currentRoom) return alert('Enter room ID');
      socket.emit('joinRoom', currentRoom);
      document.getElementById('game').style.display = 'block';
    }

    function sendLetter() {
      const letter = letters[Math.floor(Math.random() * letters.length)];
      socket.emit('generateLetter', { roomId: currentRoom, letter });
    }

    socket.on('receiveLetter', (letter) => {
      document.getElementById('letter').textContent = letter;

        object: document.getElementById('object').value,

        country: document.getElementById('country').value
      };

      const html = `<div><strong>${player}</strong><ul>` +
